metrics:
  front_leg_brace:
    description: "How well the bowler maintains a strong front leg brace during the delivery phase"
    rules:
      front_knee_angle_at_ffc:
        description: "Front Knee Angle at FFC (degrees)"
        unit: "degrees"
        compare: "greater_equal"
        thresholds:
          ideal:
            value: 170
            description: "Ideal: 170 degrees or more"
          good:
            value: 160
            description: "Good: 160-169 degrees"
          okay:
            value: 150
            description: "Okay: 150-159 degrees"
          poor:
            value: 0
            description: "Poor: less than 150 degrees"

      front_knee_angle_at_release:
        description: "Front Knee Angle at Release (degrees)"
        unit: "degrees"
        compare: "greater_equal"
        thresholds:
          ideal:
            value: 170
            description: "Ideal: 170 degrees or more"
          good:
            value: 160
            description: "Good: 160-169 degrees"
          okay:
            value: 150
            description: "Okay: 150-159 degrees"
          poor:
            value: 0
            description: "Poor: less than 150 degrees"

      difference_ffc_release:
        description: "Absolute difference in front knee angle between FFC and Release (degrees)"
        unit: "degrees"
        compare: "less_equal"
        thresholds:
          ideal:
            value: 5
            description: "Ideal: difference less than or equal to 5 degrees"
          good:
            value: 10
            description: "Good: difference less than or equal to 10 degrees"
          okay:
            value: 15
            description: "Okay: difference less than or equal to 15 degrees"
          poor:
            value: 1000
            description: "Poor: difference greater than 15 degrees"

      max_difference_ffc_release:
        description: "Maximum absolute deviation from FFC during FFC->Release window (degrees)"
        unit: "degrees"
        compare: "less_equal"
        thresholds:
          ideal:
            value: 10
            description: "Ideal: max deviation less than or equal to 10 degrees"
          good:
            value: 15
            description: "Good: max deviation less than or equal to 15 degrees"
          okay:
            value: 20
            description: "Okay: max deviation less than or equal to 20 degrees"
          poor:
            value: 1000
            description: "Poor: max deviation greater than 20 degrees"

# Notes:
# - 'compare' indicates whether better results are achieved by a larger value
#   (greater_equal) or by a smaller value (less_equal).
# - Thresholds use numeric cutoffs. For 'poor' on less_equal metrics we use
#   a large number (1000) to represent a catch-all upper bound; reducers
#   consuming this file can treat thresholds as ranges (ideal..good..okay..poor).

