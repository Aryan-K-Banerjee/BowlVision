<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BowlVision Report</title>
    <link rel="stylesheet" href="static/report.css">
</head>

<body>
    <header>
        <h1>BowlVision Session Report</h1>
        <div class="metadata">
            <div class="session-info">
                <h2>BowlVision Session — Purdue Indoor</h2>
                <p>Side and back view capture before nationals.</p>
                <p class="date">2025-11-09</p>
            </div>
            <div class="bowler-info">
                <h3>Aryan Banerjee</h3>
                <p>Fast Bowler (Right)</p>
                <p>Overall Score: 1.00</p>
            </div>
        </div>
    </header>

    <nav class="variant-selector">
        <button class="variant-btn active" data-variant="original">Original</button>
        <button class="variant-btn" data-variant="skeleton">Skeleton</button>
        <button class="variant-btn" data-variant="overlay">Overlay</button>
    </nav>

    <main>
        <!-- Event screenshots -->
        <section class="view-section" id="events-section">
            <h2>Key Events</h2>
            <div class="grid-4up" id="events-grid"></div>
        </section>

        <!-- Metrics -->
        <section class="metric-section" id="metrics-section">
            <h2>Performance Metrics</h2>
            <div class="metric-grid" id="metrics-grid"></div>
        </section>
    </main>

    <script>
        const REPORT_DATA = {"version": "1.0", "header": {"session_info": {"name": "BowlVision Session \u00e2\u20ac\u201d Purdue Indoor", "description": "Side and back view capture before nationals.", "date": "2025-11-09"}, "bowler_info": {"name": "Aryan Banerjee", "type": "Fast Bowler", "description": "Tall right-arm quick who attacks the stumps and works in-swing with a firm front leg brace.", "hand": "Right"}, "bowler_image": "bowler_image.jpg", "score_summary": "Overall Score: 1.00", "classification_summary": "Knee Dominant, Side On", "video_existence_summary": "Both back and side view videos available"}, "video_events_classification": {"video_summary": {"back_exists": true, "side_exists": true}, "events_by_view": {"back": {"jump": {"frame": 60, "time": 2.0}, "bfc": {"frame": 67, "time": 2.2333333333333334}, "ffc": {"frame": 74, "time": 2.4666666666666677}, "release": {"frame": 78, "time": 2.6000000000000005}}, "side": {"jump": {"frame": 60, "time": 2.0}, "bfc": {"frame": 66, "time": 2.1999999999999997}, "ffc": {"frame": 75, "time": 2.4999999999999996}, "release": {"frame": 78, "time": 2.6}}}, "classification": {"hip_vs_knee_dominance": "knee_dominant", "bowler_alignment": "side_on"}, "screenshots": [{"view": "side", "frames": [60], "blended": false, "types": ["original", "skeleton", "overlay"], "angles": ["none"], "crop_strategy": "square_around_bowler", "output_name": "event_jump_side"}, {"view": "side", "frames": [66], "blended": false, "types": ["original", "skeleton", "overlay"], "angles": ["none"], "crop_strategy": "square_around_bowler", "output_name": "event_bfc_side"}, {"view": "side", "frames": [75], "blended": false, "types": ["original", "skeleton", "overlay"], "angles": ["none"], "crop_strategy": "square_around_bowler", "output_name": "event_ffc_side"}, {"view": "side", "frames": [78], "blended": false, "types": ["original", "skeleton", "overlay"], "angles": ["none"], "crop_strategy": "square_around_bowler", "output_name": "event_release_side"}, {"view": "back", "frames": [60], "blended": false, "types": ["original", "skeleton", "overlay"], "angles": ["none"], "crop_strategy": "square_around_bowler", "output_name": "event_jump_back"}, {"view": "back", "frames": [67], "blended": false, "types": ["original", "skeleton", "overlay"], "angles": ["none"], "crop_strategy": "square_around_bowler", "output_name": "event_bfc_back"}, {"view": "back", "frames": [74], "blended": false, "types": ["original", "skeleton", "overlay"], "angles": ["none"], "crop_strategy": "square_around_bowler", "output_name": "event_ffc_back"}, {"view": "back", "frames": [78], "blended": false, "types": ["original", "skeleton", "overlay"], "angles": ["none"], "crop_strategy": "square_around_bowler", "output_name": "event_release_back"}]}, "scores": {"overall_score": 1.0, "subscores": [{"name": "Front Leg Brace", "score": 1.0}]}, "metrics": [{"id": "front_leg_brace", "name": "Front Leg Brace", "group": "Brace", "value": 191.36331464346986, "unit": "degrees", "score": 1.0, "rating": "ideal", "tags": [], "description": "Front knee angle at FFC - measures leg brace quality", "analysis": "Front knee at FFC: 191.4\u00b0, at release: 190.1\u00b0", "screenshots": [{"view": "side", "frames": [75], "blended": false, "types": ["original", "skeleton", "overlay"], "angles": ["front_knee"], "angle_value": 191.36331464346986, "crop_strategy": "front_leg_focus", "output_name": "metric_front_leg_brace_ffc"}, {"view": "side", "frames": [78], "blended": false, "types": ["original", "skeleton", "overlay"], "angles": ["front_knee"], "angle_value": 190.08988566608556, "crop_strategy": "front_leg_focus", "output_name": "metric_front_leg_brace_release"}]}]};
        let currentVariant = 'original';

        function initReport() {
            renderEventScreenshots();
            renderMetrics();
            setupVariantSwitcher();
        }

        function renderEventScreenshots() {
            const container = document.getElementById('events-grid');
            const screenshots = REPORT_DATA.video_events_classification?.screenshots || [];

            screenshots.forEach(spec => {
                const panelDiv = createPanel(spec.output_name, spec.types);
                container.appendChild(panelDiv);
            });
        }

        function renderMetrics() {
            const container = document.getElementById('metrics-grid');
            const metrics = REPORT_DATA.metrics || [];

            metrics.forEach(metric => {
                const screenshots = metric.screenshots || [];
                screenshots.forEach(spec => {
                    const label = `${metric.name} - ${spec.output_name.split('_').pop()}`;
                    const panelDiv = createPanel(spec.output_name, spec.types, label);
                    container.appendChild(panelDiv);
                });
            });
        }

        function createPanel(outputName, types, customLabel = null) {
            const panelDiv = document.createElement('div');
            panelDiv.className = 'panel';

            const img = document.createElement('img');
            img.dataset.baseName = outputName;

            // Set data attributes for each type
            types.forEach(type => {
                const attrName = type + 'Src';
                img.dataset[attrName] = `screenshots/${outputName}_${type}.png`;
            });

            // Set initial source
            img.src = img.dataset[currentVariant + 'Src'];
            img.alt = customLabel || outputName.replace(/_/g, ' ');

            panelDiv.appendChild(img);

            const label = document.createElement('p');
            label.className = 'panel-label';
            label.textContent = customLabel || outputName.replace(/_/g, ' ').toUpperCase();
            panelDiv.appendChild(label);

            return panelDiv;
        }

        function setupVariantSwitcher() {
            document.querySelectorAll('.variant-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    switchVariant(btn.dataset.variant);
                });
            });
        }

        function switchVariant(variant) {
            currentVariant = variant;

            // Update button states
            document.querySelectorAll('.variant-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.variant === variant);
            });

            // Update all images
            document.querySelectorAll('img[data-base-name]').forEach(img => {
                const srcKey = variant + 'Src';
                if (img.dataset[srcKey]) {
                    img.src = img.dataset[srcKey];
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initReport);
    </script>
</body>

</html>
